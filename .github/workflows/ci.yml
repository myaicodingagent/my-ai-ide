name: CI

# Type check, build, and the tests that need nothing but Node and git. The tests that drive the packaged app, NVDA, Docker, WSL,
# real SSH servers or the model API are run by hand (see "Develop" in the README).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Tests without a window
        shell: bash
        run: |
          set -e
          git config --global user.name ci
          git config --global user.email ci@example.com
          for t in git fsops index merge contrast nbmodel when backend ext liveshare-many; do
            echo "=== test:$t"
            npm run test:$t
          done
